name: skript-variables
version: '1.1.2-beta'
main: com.skriptvariables.SkriptVariables
api-version: '1.21'
author: iCJH
description: 'Skript addon for editing variables easily. Browse, edit and delete variables from a web UI.'
website: https://github.com/CJH3139/skript-variables

depend:
  - Skript

softdepend:
  - oopsk

commands:
  skv:
    description: Skript-Variables editor commands
    usage: /skv <editor|apply|help>
    aliases:
      - sv
      - skriptvariables
      - skvariables
    permission: skriptvariables.use
    permission-message: You don't have permission to use Skript-Variables.

permissions:
  skriptvariables.use:
    description: Allows basic /skv command access
    default: op
  skriptvariables.editor:
    description: Allows opening the variable editor and applying changes
    default: op
  skriptvariables.profile:
    description: Allows recording and viewing Skript profiles
    default: op
